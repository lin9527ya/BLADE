services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blade}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blade} -d ${POSTGRES_DB:-blade}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  blade:
    # 本地构建（不再引用任何外部镜像）：先 ./build.sh 产出 dist/<arch>/blade，再 compose up --build。
    build: .
    image: blade:${BLADE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BLADE_PG_DSN: postgres://${POSTGRES_USER:-blade}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blade}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BLADE_LLM_PROVIDER: ${BLADE_LLM_PROVIDER:-}
      BLADE_LLM_MODEL: ${BLADE_LLM_MODEL:-}
      BLADE_LLM_BASE_URL: ${BLADE_LLM_BASE_URL:-}
      BLADE_LLM_PROXY: ${BLADE_LLM_PROXY:-}
    ports:
      # 只映射到宿主 loopback（P42）：公网访问请走 Cloudflare Tunnel 或 SSH 隧道（见 deploy/）。
      # 真要直连公网，也请配合防火墙只放行 Cloudflare 来源段，别裸奔。
      - "127.0.0.1:8787:8787"
      # 8788 是容器内 agent 用的录制代理，只绑容器 loopback；不发布到宿主。
      # 需要在宿主机手工抓包时，走 docker exec 或在容器内显式改 -proxy 监听地址。
    # 应用关闭有 5s HTTP shutdown + 20s drain；30s 给收尾留余量，避免 docker
    # 默认 10s 后 SIGKILL 把正在写的意图终态打断。
    stop_grace_period: 30s
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
