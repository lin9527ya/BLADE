# staticcheck 配置（CI 在 .github/workflows/test.yml 的 go job 里跑，版本钉死在该文件）。
#
# 关掉 ST 家族（stylecheck）。实测本仓 ST 告警 93 条：64 条是 ST1000「包内至少一个文件应有包
# 注释」、27 条是 ST1020/1021/1022「导出符号的注释应写成『XXX ...』的形式」，余下是首字母缩写
# （ST1003）与接收者命名一致性（ST1016）。这些全是对**存量代码**的文档与命名风格意见，照改只
# 换来 churn，不换来正确性；而包注释这类东西要么全仓补一遍，要么就不做，不适合作为 CI 门禁。
#
# 本仓接 staticcheck 图的是它的**正确性检查**（SA/S/U），这几类接入时各抓到了真东西：
#   SA4006 赋值后未读  → 抓出一条「注释声称断言了任务出现在列表里、实际只断言了状态码」的测试
#   SA9003 空分支      → 抓出 llmrec 里一处重构残留的空 if
#   U1000 未使用       → 抓出 3 处死代码（均已核实不是 bug 而是残留）
#   SA1012 / SA2001    → 2 处需要写明理由的测试形态
# 这些保持全开。
#
# 少数「确认不该照检查改」的地方用行内 //lint:ignore 定点抑制并写明理由，例如
# tar.TypeRegA：废弃的是常量名而非行为，删掉那一支会让旧式 tar 归档在解包时静默丢文件。
#
# 下面按 ID 逐条列举而非用 "-ST" 前缀——实测前缀写法不可靠（`-ST` 只消掉一部分，
# ST1005 反而漏回），显式列举才可验证。
checks = [
  "all",
  "-ST1000", # 包注释
  "-ST1003", # 首字母缩写（Ts → TS）
  "-ST1005", # 错误串首字母大写（本仓错误串以专有名词开头）
  "-ST1016", # 同类型方法的接收者命名一致性
  "-ST1020", # 导出方法注释格式
  "-ST1021", # 导出类型注释格式
  "-ST1022", # 导出变量注释格式
]
